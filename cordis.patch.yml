# dsh-async-tools 的 bundle 补丁：一条宿主行（即本包的宿主角色）。
#
# 单包两角色（设计 §1.1/§1.3）：行配置里**没有 `toolName`** 时，`lib/index.js` 把
# apply 分派给 `lib/host.js` 的 `applyHostHalf`——**把本行 config 物化成生效快照并
# 跟随 volatile 提交刷新**（`lib/settings.js` 的 `attachSnapshotSource`，设计 §5.1），
# **不注册任何工具**。设置入口由本行 Config 的 volatile 字段 + 插件页卡片承载
# （设计 §5.3/§5.4），预设生命周期归 loader（设计 §7.1）。
#
# 这一行的行名必须是**平名** `dsh-async-tools`：`dsh-client-modules` 只把平名包
# 纳入客户端模块图（`exactPackageSpecifier` 不收带子路径的行名，该行会被静默跳过、
# 卡片永不渲染且无报错）。卡片本体在包根的 `client.js`（`dsh.client` 声明的注入表）。
#
# 这一行**不得携带 `toolName`**：带了就会把它变成工具行——宿主侧的工具进
# **全局工具层**，每个预设都会默认带上（需求 §3.2）。`test/two-planes.test.mjs` 的 T5
# 反向锁死本文件不得出现 `toolName`。
# 预算字段的 `config:` 是**合法**的：它是"改出厂值"的正式入口（组合层，
# schema 默认值 < 本行 config < 设置卡片的 volatile 提交；需要重启生效——组合树
# 在启动时构建一次）。默认留空。
#
# 宿主行的**快照链零服务依赖**（`'loader/volatile-update'` 是 loader 派发给本
# fiber 的事件，监听挂在宿主行自己的 ctx 上即可），但 `lib/index.js` 的静态
# `inject` 是**模块级**的：九项服务（tools / jobs / shell 执行器 / shellEnv /
# subagents / timer / sessionProjections / agents / workingDirectory——设计 §1.3；
# `agents` 供可续派生与注册表状态读取，`sessionProjections` 供模型选择路由校验，
# `workingDirectory` 供 `async_run` 取会话当前有效目录）同时约束宿主行与工具行
# ——两角色共用同一个入口，快照链本身不消费这些服务不代表宿主行不受静态依赖；
# 任一缺席时本行进入等待而不是启动。宿主半边另有**可选的运行时 inject**
# （`lib/host.js` 的 `applyHostHalf`：纪律段（c 防线 context 与预设执行纪律
# section）的 `systemPrompt`，提问接管的 `sessions` / `sessionProjections` /
# `agents`——运行时接线条件不满足时仅该子 scope 不激活，插件入口仍须先满足上面
# 九项固定依赖，失效安全方向 = 关；预设过滤两服务经 `ctx.get` 在段文本内现读，
# 不进等待名单）。
