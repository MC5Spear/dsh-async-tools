# The `dsh-async-create` agent preset: the CREATION-side agent (cordis baseline)
# with an ASYNCHRONOUS shell and a single bounded-wait derivation entry.
#
# 结构（设计 §3.6）：本文件是 `dsh.bundle.patch` 数组的一项——一条预设声明行
# （`@deepseek-ai/dsh-agent-preset`），config.plugins 是完整子清单。预设生命周期由
# loader 拥有：本包从 bundles 移除即预设消失，无清理代码（设计 §7.1）。
#
# 基线 = 随宿主 0.2.0-rc.2 发布的 shipped 创造模式（cordis）预设补丁（需求 §7.3；
# 基线位置由 tools/validate-preset.mjs 按需求读取）。相对基线的手术（设计 §3.6
# "两者相对基线的共同差异"，逐条给依据）：
#   1. tool-bash 无条件 disabled: true——禁同步 shell（需求 §3.1），两平台工具清单
#      一致（需求 §3.3）；
#   2. 不挂 tool-pwsh 行——前台同步 shell 到期杀进程树，与异步语义冲突（需求 §3.1）；
#   3. tool-bash 之后连续成组新增四行 dsh-async-tools（toolName 分派，各行携带
#      owningPreset 归属声明——需求 §6.2 描述警示按行归属判定，非 volatile）；
#   4. tool-subagent 系委托入口（单发 / fork / codex / claude-code）置
#      disabled: true、config 逐字保留（需求 §3.1：派生入口唯一 = async_agent，
#      结构性禁用强于提示词约束）；管理侧 tool-subagent-control / -list-agents 与
#      引擎服务 workflow-ptc 保持在场；
#   4b. tool-workflow 置 disabled: true（需求 §3.1：编排只走 async_workflow）；第五行
#      async_workflow 插 delegation 组内 tool-workflow 行后——编排引擎是组内隔离服务，
#      组外行取不到（需求 §3.2 末条、设计 §3.5）；workflow-ptc（引擎服务，供电）保留。
#      失去宿主 workflow 工具的脚本编排参数集合——出路 = async_workflow（同引擎、
#      异步语义），或按宿主规则换预设开新会话（需求 §3.1 末条）；
#   5. tool-plugin-manager 的 disabled 从基线的 !!js 表达式换成布尔 true
#      （与 dsh-async 补丁一致的手术）；
#   6. persona prefix 在基线身份句之上加异步纪律（与 dsh-async 预设逐字同源）+
#      后台委托强制规则（锚句被 tools/validate-preset.mjs 锁死，同 dsh-async 补丁）；
#   7. 预设行不带 disabled 护栏（与 dsh-async 补丁同款，理由见该文件头注）；
#   8. 其余行与基线逐字一致（含组内整段 config、skill-filesystem 的 customSkillDirs
#      表达式与行序——cordis 的 skill 系行在尾部，不在 tool-jobs 之后）。
# 创作指导不写回 persona：基线把它交给 skill 系行承载（需求 §3.1"保留插件和预设
# 创作功能及对应 skill 工具"）。
- insert:
    - id: preset-dsh-async-create
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-async-create
        name: 异步创造模式
        description: 在创造模式基础上改用异步 shell 与后台委托的插件/预设创作 Agent：async_run 的命令超出首次等待不会被杀掉，而是转后台并返回作业编号（job_id）；子代理一律经 async_agent 后台派生，用 async_wait_agent 有界等待读取；用户插话时等待立即返回且后台工作不受影响。
        order: 6
        plugins:
          # ── identity（手术 6：persona prefix）──
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: >-
                You are a coding agent powered by the {{model}} model.
                This deployment runs commands ASYNCHRONOUSLY. `async_run` returns a job_id
                instead of blocking when a command outlives its yield budget: when that
                happens, keep working on other things and call `async_wait_job` later instead
                of waiting idly or re-running the command. Use `async_wait_agent` (bounded,
                interruptible) rather than polling when you need a background subagent's
                outcome. Never treat a returned job_id as a failure.
                DELEGATION RULES (hard rules, not advice):
                1) Delegations are ALWAYS background. async_agent is the ONLY delegation
                entry in this preset — it has no foreground mode. subagent / subagent_fork
                are disabled here; do not call them.
                2) When you need a subagent's result, wait with async_wait_agent (bounded
                wait_ms). Do not poll in a loop; do not re-delegate just to check progress;
                the final answer arrives as its own message.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          # ── shell（手术 1/2/3）──
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: true
          - id: async-run
            name: dsh-async-tools
            config:
              toolName: async_run
              owningPreset: dsh-async-create
          - id: async-wait-job
            name: dsh-async-tools
            config:
              toolName: async_wait_job
              owningPreset: dsh-async-create
          - id: async-wait-agent
            name: dsh-async-tools
            config:
              toolName: async_wait_agent
              owningPreset: dsh-async-create
          - id: async-agent
            name: dsh-async-tools
            config:
              toolName: async_agent
              owningPreset: dsh-async-create
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          # ── planning（与基线逐字一致）──
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          # ── compaction（与基线逐字一致）──
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          # ── delegation（手术 4：原生委托入口结构性禁用，config 逐字保留）──
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              # 宿主编排工具禁用（需求 §3.1：编排只走 async_workflow；引擎服务行保留供电）。
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
                disabled: true
              # 第五行 async_workflow 插在 delegation 组内（tool-workflow 行后）——
              # 编排引擎是组内隔离服务，组外行 ctx.get 恒取不到（需求 §3.2 末条、设计 §3.5）。
              - id: async-workflow
                name: dsh-async-tools
                config:
                  toolName: async_workflow
                  owningPreset: dsh-async-create
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          # ── remaining model-facing rows（与基线逐字一致，含行序）──
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-cordis
            name: '@deepseek-ai/dsh-tool-cordis'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          # ── 手术 5：plugin-manager 布尔禁用 ──
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
