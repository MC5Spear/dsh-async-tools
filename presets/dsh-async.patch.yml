# `dsh-async` 预设：改用异步 shell 的完整编码 Agent。
#
# 结构（设计 §3.6）：本文件是 `dsh.bundle.patch` 数组的一项——一条预设声明行
# （`@deepseek-ai/dsh-agent-preset`），config.plugins 是完整子清单。预设生命周期由
# loader 拥有：本包从 bundles 移除即预设消失，无清理代码（设计 §7.1）。
#
# 基线 = 随宿主 0.2.1-rc.2 发布的 shipped standard 预设补丁（需求 §7.3；基线位置由
# tools/validate-preset.mjs 按需求读取，不硬编码本机路径）。相对基线的改动
# （设计 §3.6"两者相对基线的共同差异"，逐条给依据）：
#   1. tool-bash 无条件 disabled: true——禁同步 shell（需求 §3.1），两平台工具清单
#      一致（需求 §3.3）；
#   2. 不挂 tool-pwsh 行——前台同步 shell 到期杀进程树，与异步语义冲突（需求 §3.1）；
#   3. tool-bash 之后连续成组新增四行 dsh-async-tools（toolName 分派）；第五行
#      async_workflow 在 delegation 组内 tool-workflow 行后——编排引擎是组内隔离服务，
#      组外行取不到（需求 §3.2 末条、设计 §3.5）。五行 config 均携带
#      owningPreset 归属声明（设计 §6.2——描述警示按行归属判定，非 volatile）；
#   4. tool-workflow 与 tool-subagent 系委托入口（单发 / fork）置 disabled: true
#      （需求 §3.1：禁可前台占住批次的原生委托／编排入口；config 逐字保留以便翻转）。
#      被禁入口的功能出路 = async_agent / async_workflow，或按宿主规则换预设开新会话
#      （需求 §3.1 末条）；workflow-ptc（引擎服务，为 async_workflow 提供编排引擎）与
#      tool-subagent-control / -list-agents（非阻塞检查／管理侧，需求 §3.1"保留宿主
#      非阻塞的检查、消息和停止管理工具"）保留在场；
#   5. persona 只改 prefix：基线身份句之上加异步工作纪律与后台委托强制规则（需求
#      §3.1；锚句被 tools/validate-preset.mjs 锁死：`ALWAYS` + `async_agent is the
#      ONLY delegation entry` + `never pass run_in_background: false`、
#      `Do not poll in a loop`）。基线 persona 无 `{{cwd}}` suffix——工作目录由
#      working-directory 服务经系统提示提供，本预设不复活失效模板变量；
#   6. 预设行**不带** disabled 护栏：loader 的 `refresh()` 在服务就绪前求值
#      `disabled`——`agentPresets` 服务缺席时**静默跳过 init**，行永远不导入
#      （cordis-plugin-loader `refresh()` 的服务就绪检查）；shipped 预设行也都不带
#      护栏——`dsh-agent-preset` 自带 `inject = ['agentPresets']`，注册表缺席时行以
#      pending 等待（Cordis 原生机制），注册失败沿 fiber 抛出时**可选行只是启动
#      警告**、不拖垮进程（dsh-app-boot 的 activationDiagnostic）。判据反转：
#      validate-preset ⑥ 锁死"不得出现该护栏"）。
# 其余行（含 time-context、tool-schedule、plan-mode 文案、tool-plugin-manager 与
# tool-plugin-market 的基线禁用态、workflow-ptc 等）与基线逐字一致，以免行为漂移。
- insert:
    - id: preset-dsh-async
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: dsh-async
        name: 异步模式
        description: 在标准模式基础上改用异步 shell 的编码 Agent：async_run 的命令超出首次等待不会被杀掉，而是转后台并返回作业编号（job_id）；async_wait_job / async_wait_agent 都是有界等待读取，用户插话时立即返回且后台工作不受影响。
        order: 5
        plugins:
          # ── identity（改动项 5：persona prefix）──
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a coding agent powered by the {{model}} model.
                This deployment runs commands ASYNCHRONOUSLY. `async_run` returns a job_id
                instead of blocking when a command outlives its yield budget: when that
                happens, keep working on other things and call `async_wait_job` later instead
                of waiting idly or re-running the command. Use `async_wait_agent` (bounded,
                interruptible) rather than polling when you need a background subagent's
                outcome. Never treat a returned job_id as a failure.
                DELEGATION RULES (hard rules, not advice):
                1) Delegations are ALWAYS background. async_agent is the ONLY
                delegation entry in this preset (it has no foreground mode); the
                host subagent / subagent_fork tools are disabled here. A foreground
                delegation blocks the entire tool batch — never pass
                run_in_background: false.
                2) When you need a subagent's result, wait with async_wait_agent (bounded
                wait_ms). Do not poll in a loop; do not re-delegate just to check
                progress; the final answer arrives as its own message.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          # ── shell（改动项 1/2/3）──
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: true
          - id: async-run
            name: dsh-async-tools
            config:
              toolName: async_run
              owningPreset: dsh-async
          - id: async-wait-job
            name: dsh-async-tools
            config:
              toolName: async_wait_job
              owningPreset: dsh-async
          - id: async-wait-agent
            name: dsh-async-tools
            config:
              toolName: async_wait_agent
              owningPreset: dsh-async
          - id: async-agent
            name: dsh-async-tools
            config:
              toolName: async_agent
              owningPreset: dsh-async
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          # ── planning（与基线逐字一致）──
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          # ── compaction（与基线逐字一致）──
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          # ── delegation（改动项 4 在此组）──
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              # 宿主单发／派生委托入口禁用（需求 §3.1：禁可前台占住批次的原生委托
              # 入口；config 逐字保留以便翻转）。前台模式与 reasoning_effort /
              # persona / toolFilter / maxDepth 等原生参数不在本包创建工具中——
              # 需要时按宿主规则换预设开新会话（需求 §3.1 末条）。
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
                disabled: true
              # 第五行 async_workflow 插在 delegation 组内（tool-workflow 行后）——
              # 编排引擎是组内隔离服务，组外行 ctx.get 恒取不到（需求 §3.2 末条、
              # 设计 §3.5/§3.6）；组内注册工具的成例即上面的 tool-workflow 行。
              - id: async-workflow
                name: dsh-async-tools
                config:
                  toolName: async_workflow
                  owningPreset: dsh-async
          # ── remaining model-facing rows（plugin-manager 与 plugin-market 保持基线禁用态）──
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
